[project]
name = "ec-planner-agent-service"
version = "0.1.0"
description = "PlanCraft Event & Celebration Planner Google ADK Agent Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "google-adk>=0.1.0",
    "a2ui-agent-sdk>=0.4.0,<0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false


